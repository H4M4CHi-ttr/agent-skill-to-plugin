name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package for tests
        run: |
          python -m pip install build==1.3.0
          python -m pip install -e .

      - name: Compile source
        run: python -m compileall -q scripts

      - name: Run offline tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v

      - name: Build sdist and wheel
        run: python -m build

      - name: Install built wheel
        run: python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.run([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheels[0])], check=True)"

      - name: Verify installed wheel and CLI
        run: |
          python -c "import agent_skill_to_plugin; assert agent_skill_to_plugin.TOOL_VERSION == '0.5.0'"
          agent-skill-to-plugin --version

      - name: Build and verify uploadable Skill ZIP
        run: python scripts/build_skill_zip.py --output ../agent-skill-to-plugin-skill.zip
